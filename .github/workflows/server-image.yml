name: Publish game server image

# Builds the game server container (server/Dockerfile, which also carries the game's web pages) on every push to
# main that touches the game or the server, and publishes it as ghcr.io/scottjahn/frontline1944:latest.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'js/**'
      - 'icons/**'
      - 'index.html'
      - 'editor.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/scottjahn/frontline1944

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Frontline 1944 game server
          cache-from: type=gha
          cache-to: type=gha,mode=max
