# Frontline 1944 game server, using the image GitHub builds on every push (see .github/workflows/server-image.yml).
#   Start / update:   docker compose -f server/docker-compose.yml pull && docker compose -f server/docker-compose.yml up -d
# Caddy reaches it over a shared Docker network as frontline1944:8080, so no port is published on the host.
# Set the network name below to the one your Caddy container is on (docker network ls).
services:
  frontline1944:
    image: ghcr.io/scottjahn/frontline1944:latest
    container_name: frontline1944
    restart: unless-stopped
    environment:
      - MAX_ROOMS=6
    networks:
      - caddy

networks:
  caddy:
    external: true
    name: caddy
